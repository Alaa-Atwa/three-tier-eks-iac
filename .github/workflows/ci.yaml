name: ci for the app
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout (get the code onto the runner)
        uses: actions/checkout@v4

      - name: configure AWS credential
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: "us-east-1"
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR login
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # the backend image
      - name: build, tag the backend image, then push it to ECR
        env:
          ECR_REGISTERY: ${{ steps.login-ecr.outputs.reigstery }}
          ECR_REPOSITORY: backend-app
          IMAGE_TAG: ${{ github.sha }} # a unique build tag instead of using latest
        run: |
          docker build -t $ECR_REGISTERY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # the frontend image
      - name: build, tag the backend image, then push it to ECR
        env:
          ECR_REGISTERY: ${{ steps.login-ecr.outputs.reigstery }}
          ECR_REPOSITORY: frontend-app
          IMAGE_TAG: ${{ github.sha }} # a unique build tag instead of using latest
        run: |
          docker build -t $ECR_REGISTERY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
