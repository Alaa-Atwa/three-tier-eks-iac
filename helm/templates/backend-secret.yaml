# at install time:
#   helm install three-tier ./helm -n three-tier \
#     --set backend.mongoConnStr='mongodb://user:pass@host:27017/tasks?authSource=admin'
apiVersion: v1
kind: Secret
metadata:
  name: mongo-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  MONGO_CONN_STR: {{ .Values.backend.mongoConnStr | default "will_be_changed" | quote }}